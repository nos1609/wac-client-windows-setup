name: WAC portable checks

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
    inputs:
      base_commit:
        description: Full base commit SHA for the trusted candidate
        required: true
        type: string

concurrency:
  group: ${{ github.event_name == 'push' && 'wac-review' || 'wac-portable' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event.repository.private && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')) }}
    runs-on: ${{ vars.COMMON_LIGHT_RUNNER || 'self-hosted' }}
    outputs:
      base: ${{ steps.range.outputs.base_commit }}
      head: ${{ steps.candidate.outputs.head }}
      review_base: ${{ steps.target.outputs.base }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the checked-out commit to the event
        id: candidate
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          [[ "$head" =~ ^[0-9a-f]{40}$ && "$head" == "$EVENT_SHA" ]]
          printf 'head=%s\n' "$head" >> "$GITHUB_OUTPUT"
      - name: Check out the shared range action
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nos1609/fj-actions-common
          ref: 2896a7a7ef3a375220296510f2643ccef4476243
          path: .ci-common
          persist-credentials: false
      - name: Validate the manual check base
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          BASE: ${{ inputs.base_commit }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$BASE" != 0000000000000000000000000000000000000000 && "$BASE" != "$HEAD_SHA" ]]
      - id: range
        uses: ./.ci-common/actions/candidate-range
        with:
          head_commit: ${{ github.sha }}
          payload_before: ${{ inputs.base_commit || github.event.before || '0000000000000000000000000000000000000000' }}
          first_push_base_ref: refs/remotes/origin/main
      - name: Select the full review range
        id: target
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          PUSH_BASE: ${{ steps.range.outputs.base_commit }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/feature/*) base=$(git merge-base "$HEAD_SHA" refs/remotes/origin/main) ;;
            refs/heads/main) base=$PUSH_BASE ;;
            *) exit 1 ;;
          esac
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"

  portable:
    needs: prepare
    uses: nos1609/fj-actions-common/.forgejo/workflows/pester-ci.yml@8729acfd577841c77c09de71ef0b081e6a4b6f18
    with:
      base_commit: ${{ needs.prepare.outputs.base }}
      head_commit: ${{ needs.prepare.outputs.head }}
      script_path: scripts/test-portable.ps1
      runs_on: self-hosted

  # Forgejo evaluates caller conditions inside reusable jobs. Select push events here.
  review_inputs:
    needs: prepare
    if: ${{ github.event_name == 'push' && github.event.repository.private }}
    runs-on: ${{ vars.COMMON_LIGHT_RUNNER || 'self-hosted' }}
    steps:
      - name: Check the review range before calling CodeRabbit
        shell: bash
        env:
          BASE: ${{ needs.prepare.outputs.review_base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
        run: |
          set -euo pipefail
          [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE" != "$HEAD_SHA" && "$HEAD_SHA" == "$GITHUB_SHA" ]]

  review:
    needs: [prepare, portable, review_inputs]
    uses: nos1609/fj-actions-common/.forgejo/workflows/coderabbit-review.yml@8729acfd577841c77c09de71ef0b081e6a4b6f18
    with:
      base_commit: ${{ needs.prepare.outputs.review_base }}
      expected_head_sha: ${{ needs.prepare.outputs.head }}
      workflow_id: ci.yml
      continue_on_error: false
      rate_limit_max_wait_seconds: "1980"
      process_timeout_seconds: "2400"
      upload_prompts: true

  review_policy:
    needs: [prepare, review_inputs, review]
    uses: nos1609/fj-actions-common/.forgejo/workflows/review-policy.yml@8729acfd577841c77c09de71ef0b081e6a4b6f18
    with:
      expected_head_sha: ${{ needs.prepare.outputs.head }}
      base_commit: ${{ needs.prepare.outputs.review_base }}
      source_task_id: ${{ needs.review.outputs.task_id }}
      source_workflow_id: ci.yml
