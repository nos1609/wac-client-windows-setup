name: WAC distribution

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']

concurrency:
  group: wac-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.repository.private }}
    runs-on: self-hosted
    outputs:
      zip_sha256: ${{ steps.build.outputs.zip_sha256 }}
      sum_sha256: ${{ steps.build.outputs.sum_sha256 }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build distribution for the event commit
        id: build
        shell: bash
        env:
          TZ: UTC
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          # Preserve the commit time in ZIP entries so retries produce the same bytes.
          git ls-files -z | xargs -0 touch -d "@$(git log -1 --format=%ct)"
          pwsh -NoProfile -NonInteractive -File scripts/build-dist.ps1
          zip=dist/wac-client-windows-setup.zip
          printf 'zip_sha256=%s\n' "$(sha256sum "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'sum_sha256=%s\n' "$(sha256sum "$zip.sha256" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Save the archive and checksum
        uses: https://code.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: wac-distribution
          path: |
            dist/wac-client-windows-setup.zip
            dist/wac-client-windows-setup.zip.sha256
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: build
    runs-on: ${{ vars.COMMON_LIGHT_RUNNER || 'self-hosted' }}
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: https://code.forgejo.org/actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: wac-distribution
          path: dist
      - name: Check distribution against the source commit
        id: check
        shell: bash
        env:
          ZIP_SHA256: ${{ needs.build.outputs.zip_sha256 }}
          SUM_SHA256: ${{ needs.build.outputs.sum_sha256 }}
        run: python3 scripts/verify-package.py

  publish:
    needs: [build, verify]
    if: ${{ github.event.repository.private && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: self-hosted
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nos1609/fj-actions-common
          ref: 6e35d0ce03ac98fc0978848ae1ae00dd20813071
          path: .ci-common
          persist-credentials: false
      - uses: https://code.forgejo.org/actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: wac-distribution
          path: dist
      - name: Publish distribution ZIP
        uses: ./.ci-common/actions/generic-package-publish
        env:
          GENERIC_PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        with:
          file: dist/wac-client-windows-setup.zip
          sha256: ${{ needs.build.outputs.zip_sha256 }}
          package_name: wac-client-windows-setup
          version: ${{ needs.verify.outputs.version }}
          source_commit: ${{ github.sha }}
          receipt_path: test-results/generic-package/zip.json
      - name: Publish distribution checksum
        uses: ./.ci-common/actions/generic-package-publish
        env:
          GENERIC_PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        with:
          file: dist/wac-client-windows-setup.zip.sha256
          sha256: ${{ needs.build.outputs.sum_sha256 }}
          package_name: wac-client-windows-setup
          version: ${{ needs.verify.outputs.version }}
          source_commit: ${{ github.sha }}
          receipt_path: test-results/generic-package/checksum.json
      - name: Check out the shared release action
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nos1609/fj-actions-common
          ref: 4c4364a36ff0f8f9e5b716d07b7acbe29b6f7c45
          path: .ci-release
          persist-credentials: false
      - name: Attach the verified distribution to the Forgejo release
        uses: ./.ci-release/actions/forgejo-release-assets
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        with:
          tag: ${{ github.ref_name }}
          source_commit: ${{ github.sha }}
          assets: |
            [
              {"path":"dist/wac-client-windows-setup.zip","sha256":"${{ needs.build.outputs.zip_sha256 }}"},
              {"path":"dist/wac-client-windows-setup.zip.sha256","sha256":"${{ needs.build.outputs.sum_sha256 }}"}
            ]
